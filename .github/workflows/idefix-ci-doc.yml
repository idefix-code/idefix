name: Build and deploy docs
on:
  workflow_dispatch:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install doxygen
        run: sudo apt-get install -y doxygen

      - name: install python dependencies
        run: python -m pip install --exists-action=w --no-cache-dir -r doc/python_requirements.txt

      - name: compile documentation
        run: python -m sphinx -T -b html -d _build/doctrees -D language=en doc/source _build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build
          destination_dir: ${{ github.ref == 'refs/heads/master' && '' || 'develop' }}
          keep_files: true
          enable_jekyll: false
