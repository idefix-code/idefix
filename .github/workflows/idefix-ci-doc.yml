name: Build and deploy docs
on:
  workflow_dispatch:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install doxygen
        run: sudo apt-get install -y doxygen

      - name: install python dependencies
        run: python -m pip install --exists-action=w --no-cache-dir -r doc/python_requirements.txt

      - name: compile documentation
        run: python -m sphinx -T -b html -d _build/doctrees -D language=en doc/source _build

      - name: Deploy to GitHub Pages
        env:
          GITHUB_REF_SLUG: ${{ github.ref }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Clone the gh-pages branch (or create it)
          git clone --branch gh-pages https://github.com/idefix-code/idefix.git gh-pages 2>/dev/null || {
            git init gh-pages &&
            cd gh-pages &&
            git remote add origin https://$GITHUB_PAT@github.com/idefix-code/idefix.git &&
            git checkout --orphan gh-pages &&
            git commit --allow-empty -m "Initial gh-pages branch" &&
            cd ..
          }

          # Determine destination directory based on branch
          if [ "$GITHUB_REF_SLUG" = "refs/heads/master" ]; then
            DEST_DIR=""
          else
            DEST_DIR="develop"
          fi

          # Copy built docs to the appropriate location in gh-pages
          if [ -z "$DEST_DIR" ]; then
            cp -r _build/* gh-pages/
          else
            mkdir -p gh-pages/$DEST_DIR
            cp -r _build/* gh-pages/$DEST_DIR/
          fi

          # Commit and push
          cd gh-pages
          git add -A
          git commit -m "Update docs from $GITHUB_REF_SLUG" || true
          git push https://$GITHUB_PAT@github.com/idefix-code/idefix.git gh-pages
