[Grid]
X1-grid       1       1.0  1024  l   100.0
X2-grid       3       0.0  156   s+  1.3707963267948966  200  u  1.7707963267948965  156  s-  3.141592653589793
X3-grid       1       0.0  512   u   6.283185307179586
coarsening    static  X3

[TimeIntegrator]
CFL            0.7
CFL_max_var    1.1
tstop          10000000.0
first_dt       1.e-6
nstages        2
max_runtime    11.8
check_nan      1
maxdivB        1e-3

[Hydro]
solver             hlld
gamma              1.66666666666666
mu                 0.6
shockFlattening    2.0

[Rad]
nFrequencies    1
solver_rad      hll_rad
reduced_c       1.e0
kappa           kramers        5.e24  0.  1.  1.
xi              constant       0.
source          full_implicit

[Units]
velocity    4.1e8
length      8.e8
density     2.4e-5

[Gravity]
potential    central
Mcentral     1.0

[Boundary]
X1-beg    userdef
X1-end    userdef
X2-beg    axis
X2-end    axis
X3-beg    periodic
X3-end    periodic

[Setup]
epsilon                0.05
beta                   1000
epsilonTop             0.25
Hideal                 4.5
densityFloor           1.0e-9
transitionSmoothing    0.5
Tceiling               3.e8
Tfloor                 1.e3

[Output]
vtk_slice1    6.283185307179586e-2  1        1.5707963267948966  cut
vtk_slice2    6.283185307179586e-2  1        1.6207963267948966  cut
